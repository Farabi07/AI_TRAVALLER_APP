events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    upstream backend {
        server backend:8000;
    }

    upstream ai_service {
        server ai_service:8000;
    }

    # HTTP server - catch all (redirect to HTTPS)
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP server for Let's Encrypt ACME challenges
    server {
        listen 80;
        server_name ai.hitmanjacktravel.com api.hitmanjacktravel.com hitmanjacktravel.com www.hitmanjacktravel.com;
        client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS for all other paths
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for api.hitmanjacktravel.com
    server {
        listen 443 ssl http2;
        server_name api.hitmanjacktravel.com;
        client_max_body_size 100M;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/api.hitmanjacktravel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hitmanjacktravel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Backend proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # HTTPS server for ai.hitmanjacktravel.com
    server {
        listen 443 ssl http2;
        server_name ai.hitmanjacktravel.com;
        client_max_body_size 100M;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/ai.hitmanjacktravel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai.hitmanjacktravel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # AI Service proxy
        location / {
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # HTTPS server for hitmanjacktravel.com
    server {
        listen 443 ssl http2;
        server_name hitmanjacktravel.com www.hitmanjacktravel.com;
        client_max_body_size 100M;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/hitmanjacktravel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hitmanjacktravel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Redirect www to non-www
        if ($host = www.hitmanjacktravel.com) {
            return 301 https://hitmanjacktravel.com$request_uri;
        }

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Backend proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # Catch-all HTTPS server for IP access
    server {
        listen 443 ssl http2 default_server;
        server_name _;
        client_max_body_size 100M;

        # Use API cert for catch-all
        ssl_certificate /etc/letsencrypt/live/api.hitmanjacktravel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hitmanjacktravel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Backend proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
